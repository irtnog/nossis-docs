[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# cf. tool.setuptools.package-dir section below
name = "nossis-docs"
description = "Serverless hosting for static, private web sites"
version = "0.0.0"
# cf. https://www.bitecode.dev/p/relieving-your-python-packaging-pain,
# https://devguide.python.org/versions/
requires-python = ">=3.11"
# cf. https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]
# To avoid unnecessary developer overhead, only set version
# constraints to address capability, compatibility, or security
# issues, and avoid pinning specific versions if possible.
dependencies = [
    "aws-lambda-powertools[tracer] @ git+https://github.com/xenophonf/powertools-lambda-python#egg=aws-lambda-powertools",
    "boto3",
    "boto3-stubs[boto3,cloudfront,codepipeline]",
    "botocore",
    "idpyoidc",
    "mypy-boto3-cloudfront",
    "mypy-boto3-codepipeline",
    "pyhumps",
]

[project.license]
file = "LICENSE"

[project.optional-dependencies]
dev = [
    "autopep8",
    "black",
    "boto3-stubs[all]",
    "build",
    "id",
    "isort",
    "jedi",
    "matplotlib",
    # https://github.com/executablebooks/mdit-py-plugins/pull/65
    "mdit-py-plugins>0.3.4",
    "myst-parser[linkify,rtd]",
    "pip-tools",
    "pre-commit",
    "pystemmer",
    "python-semantic-release",
    "rinohtype",
    "sphinxcontrib-svg2pdfconverter[CairoSVG]",
    "sphinx-autodoc2[cli]",
    "sphinx-book-theme",
    "sphinx-intl",
    "sphobjinv",
    "twine",
    "yapf",
    "yq",
    # Keep the list of flake8 plugins in sync with
    # .pre-commit-config.yaml.
    "dlint",
    "flake8-bandit",
    "flake8-bugbear",
    "flake8-comprehensions",
    "flake8-docstrings",
    "flake8-eradicate",
    "flake8-fixme",
    "flake8-future-import",
    "flake8-pytest-style",
    "flake8-requirements",
]
test = [
    "faker",
    "moto[all]",
    "pytest",
    "pytest-cov",
    "pytest-emoji",
    "pytest-md",
    "pytest-order",
    "pytest-reportlog",
    "pytest-socket",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.pytest.ini_options]
addopts = [
    # Recommended for new projects;
    # cf. https://docs.pytest.org/en/latest/explanation/goodpractices.html#choosing-an-import-mode.
    "--import-mode=importlib",
    # Ignore directories containing build artifacts;
    # cf. https://stackoverflow.com/a/64669513.
    "--ignore-glob=build*",
    "--ignore-glob=dist*",
]
# Invoke smoke tests with `pytest -k smoke` or `pytest -m "smoke and
# not slow"`.  See also https://docs.pytest.org/en/stable/mark.html,
# https://stackoverflow.com/a/52369721.
markers = [
    "slow",
    "smoke",
]

[tool.semantic_release]
commit_message = "release: cut the v{version} release\n\nAutomatically generated by python-semantic-release"
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog.environment]
autoescape = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.setuptools.package-dir]
nossis_docs = "src/nossis_docs"
